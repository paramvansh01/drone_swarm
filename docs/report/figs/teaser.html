<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>@page{size:200mm 60mm;margin:0}html,body{margin:0;padding:0}svg text{font-family:"Source Sans 3",Arial,sans-serif}</style></head><body><svg style="width:200mm;height:60mm;display:block" viewBox="0 0 1000 300" role="img" aria-label="Illustration of the C-DAWN swarm: a ground control station at the valley mouth, a relay chain of UAVs following the valley, scouts surveying priority sites, an interference zone and a cloud layer.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe9f3"/><stop offset="1" stop-color="#f6f3ec"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c3cc"/><stop offset="1" stop-color="#d9dcdc"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f9a86"/><stop offset="1" stop-color="#b7b9a3"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f7a5e"/><stop offset="1" stop-color="#8d8a6c"/></linearGradient>
    <radialGradient id="jam" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4a3aa7" stop-opacity="0.32"/><stop offset="1" stop-color="#4a3aa7" stop-opacity="0.02"/></radialGradient>
    <g id="quad">
      <line x1="-9" y1="-5" x2="9" y2="5" stroke="#1b1b19" stroke-width="1.6"/>
      <line x1="-9" y1="5" x2="9" y2="-5" stroke="#1b1b19" stroke-width="1.6"/>
      <ellipse cx="-9" cy="-5" rx="5.2" ry="1.7" fill="#1b1b19" fill-opacity="0.28"/>
      <ellipse cx="9" cy="-5" rx="5.2" ry="1.7" fill="#1b1b19" fill-opacity="0.28"/>
      <ellipse cx="-9" cy="5" rx="5.2" ry="1.7" fill="#1b1b19" fill-opacity="0.28"/>
      <ellipse cx="9" cy="5" rx="5.2" ry="1.7" fill="#1b1b19" fill-opacity="0.28"/>
      <rect x="-3.6" y="-2.6" width="7.2" height="5.2" rx="1.4" fill="currentColor"/>
    </g>
    <g id="pin"><path d="M0 0 C -6 -8 -6 -15 0 -15 C 6 -15 6 -8 0 0 Z" fill="currentColor" stroke="#1b1b19" stroke-width="0.7"/><circle cx="0" cy="-10.5" r="2.2" fill="#fff"/></g>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1b1b19"/></marker>
  </defs>
  <rect width="1000" height="300" fill="url(#sky)"/>
  <!-- cloud deck -->
  <g fill="#ffffff" fill-opacity="0.85">
    <ellipse cx="610" cy="46" rx="70" ry="13"/><ellipse cx="660" cy="38" rx="44" ry="14"/><ellipse cx="570" cy="40" rx="36" ry="10"/>
    <ellipse cx="850" cy="58" rx="56" ry="11"/><ellipse cx="885" cy="50" rx="32" ry="11"/>
  </g>
  <!-- ranges -->
  <path d="M0 150 L60 110 L110 132 L170 78 L230 118 L300 70 L360 104 L430 60 L500 98 L560 56 L640 96 L700 64 L780 100 L850 58 L920 96 L1000 72 L1000 300 L0 300 Z" fill="url(#far)"/>
  <path d="M0 190 L80 150 L140 172 L210 130 L280 170 L350 134 L420 176 L500 140 L580 180 L650 146 L740 184 L820 150 L900 182 L1000 150 L1000 300 L0 300 Z" fill="url(#mid)"/>
  <!-- snow caps -->
  <g fill="#ffffff" fill-opacity="0.9"><path d="M170 78 L158 92 L176 88 L184 94 Z"/><path d="M430 60 L418 76 L436 70 L446 78 Z"/><path d="M560 56 L548 72 L566 66 L574 74 Z"/><path d="M850 58 L838 74 L856 68 L866 76 Z"/></g>
  <!-- valley floor and river -->
  <path d="M0 300 L0 236 C 120 226 200 238 290 228 C 380 218 420 246 520 238 C 610 230 680 250 780 240 C 860 232 930 246 1000 238 L1000 300 Z" fill="url(#near)"/>
  <path d="M0 262 C 110 252 190 266 300 256 C 400 246 450 272 560 262 C 660 254 720 276 830 266 C 900 260 950 270 1000 266" fill="none" stroke="#7fb3d6" stroke-width="4" stroke-linecap="round"/>
  <!-- landslide scar -->
  <path d="M598 150 L640 142 L684 214 L618 224 Z" fill="#a38b6a" fill-opacity="0.9"/>
  <path d="M606 170 L660 204 M614 190 L650 212" stroke="#8a7355" stroke-width="1.2"/>
  <!-- geofence -->
  <path d="M40 206 C 300 190 600 196 980 188" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="6 4"/>
  <path d="M40 292 C 300 296 600 290 980 294" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- interference zone -->
  <circle cx="470" cy="226" r="62" fill="url(#jam)"/>
  <g stroke="#4a3aa7" stroke-width="1.2" fill="none"><path d="M462 234 q8 -10 16 0"/><path d="M456 238 q14 -18 28 0"/></g>
  <line x1="470" y1="240" x2="470" y2="252" stroke="#4a3aa7" stroke-width="2"/>
  <!-- GCS -->
  <g transform="translate(70 246)">
    <path d="M-22 0 L0 -18 L22 0 Z" fill="#e8e4d8" stroke="#1b1b19" stroke-width="0.9"/>
    <line x1="28" y1="0" x2="28" y2="-44" stroke="#1b1b19" stroke-width="1.6"/>
    <circle cx="28" cy="-46" r="3" fill="#1d4ed8"/>
    <g fill="none" stroke="#1d4ed8" stroke-width="1"><path d="M36 -54 a 12 12 0 0 1 0 16"/><path d="M41 -58 a 18 18 0 0 1 0 24"/></g>
    <g fill="#26272a"><rect x="-44" y="4" width="10" height="3" rx="1"/><rect x="-30" y="4" width="10" height="3" rx="1"/><rect x="-16" y="4" width="10" height="3" rx="1"/></g>
  </g>
  <!-- chain links -->
  <g stroke="#2a78d6" stroke-width="1.6" fill="none">
    <path d="M98 200 L262 128"/><path d="M262 128 L420 150" stroke-dasharray="1 0"/><path d="M420 150 L556 120"/>
    <path d="M556 120 L690 172"/><path d="M556 120 L760 196"/><path d="M262 128 L330 196"/>
  </g>
  <g fill="#2a78d6"><circle cx="180" cy="164" r="2.4"/><circle cx="340" cy="139" r="2.4"/><circle cx="488" cy="135" r="2.4"/><circle cx="624" cy="146" r="2.4"/></g>
  <!-- relays and scouts -->
  <g color="#eb6834"><use href="#quad" transform="translate(262 128) scale(1.45)"/><use href="#quad" transform="translate(420 150) scale(1.45)"/><use href="#quad" transform="translate(556 120) scale(1.45)"/></g>
  <g color="#2a78d6"><use href="#quad" transform="translate(330 196) scale(1.45)"/><use href="#quad" transform="translate(690 172) scale(1.45)"/><use href="#quad" transform="translate(760 196) scale(1.45)"/></g>
  <!-- returning aircraft -->
  <g color="#a3a19b"><use href="#quad" transform="translate(150 214) scale(1.45)"/></g>
  <path d="M176 214 L128 222" stroke="#a3a19b" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ah)"/>
  <!-- tasks -->
  <g color="#dc2626"><use href="#pin" x="690" y="226"/><use href="#pin" x="772" y="238"/></g>
  <g color="#f59e0b"><use href="#pin" x="336" y="250"/></g>
  <g color="#0f8a5f"><use href="#pin" x="222" y="248"/><use href="#pin" x="880" y="246"/></g>
  <!-- labels -->
  <g font-size="12" fill="#1b1b19">
    <text x="36" y="288">GCS + charging pads</text>
    <text x="210" y="106">relay (orange)</text>
    <text x="570" y="104">relay hop around the bend</text>
    <text x="700" y="150">scouts on P1 sites (blue)</text>
    <text x="512" y="284" fill="#4a3aa7">interference zone</text>
    <text x="612" y="136" fill="#6b5436">landslide</text>
    <text x="178" y="226" fill="#6b6a64" font-size="10.5">heading home for a battery swap</text>
    <text x="838" y="276" font-size="10.5">delivered</text>
    <text x="870" y="186" fill="#c2410c" font-size="10.5">geofence</text>
    <text x="596" y="30" fill="#6b6a64" font-size="10.5">cloud base, found by flying into it</text>
  </g>
</svg></body></html>
